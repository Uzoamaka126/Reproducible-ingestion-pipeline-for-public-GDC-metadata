[gdc]
base_url = "https://api.gdc.cancer.gov"
endpoint = "files"
format = "JSON"
page_size = 1000

# This is a required access restriction. The query builder always combines it
# with any additional filters, so config cannot broaden results to controlled data.
access_field = "files.access"
access_value = "open"

# Optional GDC filter expression as a JSON string. Leave empty to include all
# open-access files. The application must AND this expression with the
# required open-access clause above.
additional_filter_json = ""

# Fields returned by the `/files` endpoint and retained in cleaned output.
fields = [
  "file_id",
  "file_name",
  "access",
  "data_category",
  "data_type",
  "data_format",
  "file_size",
  "md5sum",
  "state",
  "updated_datetime",
  "cases.case_id",
  "cases.project.project_id",
]

[output]
# Paths are relative to the project root unless absolute paths are provided.
# Keep source responses, validated records, rejected records, and run manifests
# in separate locations.
raw_dir = "data/raw"
cleaned_dir = "data/cleaned"
rejected_dir = "data/rejected"
run_manifest_dir = "data/manifests"

[retry]
# Total attempts per request, including the initial attempt.
max_attempts = 5
# Delay before the first retry. Later waits grow exponentially:
# base_delay_seconds * backoff_multiplier ** (failed_attempt - 1).
base_delay_seconds = 1.0
backoff_multiplier = 2.0
max_delay_seconds = 60.0
