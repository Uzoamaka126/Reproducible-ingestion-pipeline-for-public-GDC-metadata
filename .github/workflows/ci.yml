name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Locked environment and mocked API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true

      - name: Check lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --locked --no-install-project

      - name: Check CLI starts
        run: uv run --no-sync python -m src --help

      - name: Run mocked API tests
        run: uv run --no-sync python -m unittest discover -s tests -v
